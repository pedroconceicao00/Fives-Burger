<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Five's Burger</title>

    <link
      rel="shortcut icon"
      href="/assets/Favicon64x64.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="styleCardapio.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="use-credentials"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav>
        <!-- Logo -->
        <a href="/index.html">
          <img
            src="/assets/Fives-Burger-Logo.png"
            alt="Five's Burger Logo"
            width="120"
          />
        </a>

        <!-- Botão hambúrguer do topo (só aparece no mobile) -->
        <button
          class="menu-toggle"
          aria-label="Abrir menu de navegação"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- Menu principal - vira carrossel no mobile -->
        <ul class="nav-links">
          <li id="inicio"><a href="../index.html">Início</a></li>
          <li id="navCardapio">
            <a href="cardapio.html" style="color: var(--color-primary)"
              >Cardápio</a
            >
          </li>
          <li id="sobre"><a href="../sobre/sobre.html">Sobre</a></li>
          <li id="contato"><a href="../contato/contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>

    <main id="cardapio">
      <!-- Botão para abrir/fechar categorias (só mobile) -->
      <button id="menuExpand" aria-expanded="false" aria-controls="menuCard">
        <span class="icon">☰</span> Categorias
      </button>

      <!-- Menu lateral de categorias (oculto no mobile) -->
      <aside id="menuCard">
        <div class="selectionMenu fechar-menu">✕ Fechar</div>
        <div class="selectionMenu ativo">Todos</div>
        <div class="selectionMenu">Lanches</div>
        <div class="selectionMenu">Combos</div>
        <div class="selectionMenu">Bebidas</div>
        <div class="selectionMenu">Sobremesa</div>
      </aside>

      <!-- Grade de produtos -->
      <div id="produtos"></div>
    </main>

    <div class="overlay" id="overlay"></div>

    <footer></footer>

    <script src="cardapio.js"></script>
  </body>
</html>
